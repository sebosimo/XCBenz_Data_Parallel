# Standalone project. No production env file, secrets, outputs or scheduler.
# Set W_FORECAST_IMAGE to an already-built weather forecast image.
services:
  w-prototype:
    image: ${W_FORECAST_IMAGE:?Set W_FORECAST_IMAGE to the existing forecast image}
    pull_policy: never
    working_dir: /app
    entrypoint: ["sh", "/app/deploy/w-prototype/run_weather.sh"]
    command:
      - --model
      - ${W_MODEL:-ch1}
      - --run
      - latest
      - --work-dir
      - /w-work
      - --output
      - /w-feed/${W_MODEL:-ch1}
    mem_limit: 3g
    cpus: 2.0
    environment:
      W_SOURCE_REVISION: ${W_SOURCE_REVISION:-unknown}
    volumes:
      - ../../w_forecast:/app/w_forecast:ro
      - .:/app/deploy/w-prototype:ro
      - ${W_WORK_DIR:?Set a dedicated W cache directory}:/w-work
      - ${W_FEED_DIR:?Set a dedicated W feed directory}:/w-feed
      - heavy-lock:/run/lock
volumes:
  heavy-lock:
    external: true
    name: ${W_HEAVY_LOCK_VOLUME:?Set the existing weather heavy-lock volume}
