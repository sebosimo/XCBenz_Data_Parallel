name: Parallel Sounding Workflow

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Download fresh data even if the latest runs are already published?"
        type: boolean
        default: true
      enable_wind_maps:
        description: "Generate packed wind-map files?"
        type: boolean
        default: true
      enable_wind_maps_ch1:
        description: "Generate CH1 wind maps?"
        type: boolean
        default: true
      enable_wind_maps_ch2:
        description: "Generate CH2 wind maps?"
        type: boolean
        default: true
      enable_sunshine_maps:
        description: "Generate browser-ready sunshine-map files?"
        type: boolean
        default: true
      wind_map_max_seconds:
        description: "Wind-map active-processing budget in seconds (0 disables)"
        type: string
        default: "0"
      data_branch:
        description: "Branch used for sandbox data publishing"
        type: string
        default: "data-test"
      download_workers:
        description: "Bounded concurrent STAC/download workers per horizon"
        type: string
        default: "6"
  schedule:
    - cron: "17,47 * * * *"

concurrency:
  group: parallel-weather-data-update
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DATA_BRANCH: ${{ github.event.inputs.data_branch || 'data-test' }}
  DOWNLOAD_WORKERS: ${{ github.event.inputs.download_workers || '6' }}
  WEB_EXPORT_DATA_ROOT: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.inputs.data_branch || 'data-test' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.preflight.outputs.should_run }}
      should_run_ch1: ${{ steps.preflight.outputs.should_run_ch1 }}
      should_run_ch2: ${{ steps.preflight.outputs.should_run_ch2 }}
      reason: ${{ steps.preflight.outputs.reason }}
      latest_ch1: ${{ steps.preflight.outputs.latest_ch1 }}
      latest_ch2: ${{ steps.preflight.outputs.latest_ch2 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check latest available runs
        id: preflight
        env:
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
        run: python scripts/preflight_runs.py

  fetch-ch1:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Restore CH1 cache from sandbox data branch
        run: |
          git fetch --depth=1 origin "$DATA_BRANCH" 2>/dev/null || echo "$DATA_BRANCH branch not found yet - starting fresh"
          git checkout FETCH_HEAD -- cache_wind_packed/ch1/ cache_sunshine_maps/ch1/ 2>/dev/null || true
          git reset HEAD -- cache_wind_packed/ cache_sunshine_maps/ manifest.json 2>/dev/null || true
          echo "Packed CH1 wind-map .nc files: $(find cache_wind_packed/ch1 -name '*.nc' 2>/dev/null | wc -l)"

      - name: Fetch CH1 map data
        env:
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
          CH1_PROFILE_MODE: none
          ENABLE_WIND_MAPS: ${{ github.event.inputs.enable_wind_maps || 'true' }}
          ENABLE_WIND_MAPS_CH1: ${{ github.event.inputs.enable_wind_maps_ch1 || 'true' }}
          WIND_MAP_MAX_SECONDS: ${{ github.event.inputs.wind_map_max_seconds || '0' }}
          ENABLE_SUNSHINE_MAPS: ${{ github.event.inputs.enable_sunshine_maps || 'true' }}
        run: uv run python fetch_data.py

      - name: Upload CH1 outputs
        uses: actions/upload-artifact@v4
        with:
          name: ch1-output
          if-no-files-found: ignore
          retention-days: 1
          path: |
            cache_wind_packed/ch1/
            cache_sunshine_maps/ch1/

  fetch-ch1-profiles:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - id: H000_H016
            start: "0"
            end: "16"
          - id: H017_H045
            start: "17"
            end: "45"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Fetch CH1 direct profile chunk
        env:
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
          CH1_PROFILE_MODE: direct-chunk
          CH1_PROFILE_CHUNK_ID: ${{ matrix.chunk.id }}
          CH1_HORIZON_START: ${{ matrix.chunk.start }}
          CH1_HORIZON_END: ${{ matrix.chunk.end }}
          ENABLE_WIND_MAPS: "false"
          ENABLE_WIND_MAPS_CH1: "false"
          ENABLE_SUNSHINE_MAPS: "false"
        run: uv run python fetch_data.py

      - name: Upload CH1 profile chunk
        uses: actions/upload-artifact@v4
        with:
          name: ch1-profile-${{ matrix.chunk.id }}
          if-no-files-found: error
          retention-days: 1
          path: |
            web_profile_chunks/

  fetch-ch2:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - id: H000_H030
            start: "0"
            end: "30"
          - id: H031_H060
            start: "31"
            end: "60"
          - id: H061_H090
            start: "61"
            end: "90"
          - id: H091_H120
            start: "91"
            end: "120"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Fetch CH2 map data
        env:
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
          CH2_PROFILE_MODE: none
          CH2_HORIZON_START: ${{ matrix.chunk.start }}
          CH2_HORIZON_END: ${{ matrix.chunk.end }}
          CH2_REQUIRE_FULL_HORIZON_RUN: "true"
          CH2_WIND_MAP_OUT_ROOT: map_chunk_outputs/${{ matrix.chunk.id }}/cache_wind_packed
          CH2_SUNSHINE_MAP_OUT_ROOT: map_chunk_outputs/${{ matrix.chunk.id }}/cache_sunshine_maps
          ENABLE_WIND_MAPS: ${{ github.event.inputs.enable_wind_maps || 'true' }}
          ENABLE_WIND_MAPS_CH2: ${{ github.event.inputs.enable_wind_maps_ch2 || 'true' }}
          WIND_MAP_MAX_SECONDS: ${{ github.event.inputs.wind_map_max_seconds || '0' }}
          ENABLE_SUNSHINE_MAPS: ${{ github.event.inputs.enable_sunshine_maps || 'true' }}
        run: uv run python fetch_data_ch2.py

      - name: Upload CH2 outputs
        uses: actions/upload-artifact@v4
        with:
          name: ch2-map-${{ matrix.chunk.id }}
          if-no-files-found: ignore
          retention-days: 1
          path: |
            map_chunk_outputs/${{ matrix.chunk.id }}/

  fetch-ch2-profiles:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - id: H000_H030
            start: "0"
            end: "30"
          - id: H031_H060
            start: "31"
            end: "60"
          - id: H061_H090
            start: "61"
            end: "90"
          - id: H091_H120
            start: "91"
            end: "120"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Fetch CH2 direct profile chunk
        env:
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
          CH2_PROFILE_MODE: direct-chunk
          CH2_PROFILE_CHUNK_ID: ${{ matrix.chunk.id }}
          CH2_HORIZON_START: ${{ matrix.chunk.start }}
          CH2_HORIZON_END: ${{ matrix.chunk.end }}
          ENABLE_WIND_MAPS: "false"
          ENABLE_WIND_MAPS_CH2: "false"
          ENABLE_SUNSHINE_MAPS: "false"
        run: uv run python fetch_data_ch2.py

      - name: Upload CH2 profile chunk
        uses: actions/upload-artifact@v4
        with:
          name: ch2-profile-${{ matrix.chunk.id }}
          if-no-files-found: error
          retention-days: 1
          path: |
            web_profile_chunks/

  publish:
    needs:
      - preflight
      - fetch-ch1
      - fetch-ch1-profiles
      - fetch-ch2
      - fetch-ch2-profiles
    if: |
      always() &&
      needs.preflight.outputs.should_run == 'true' &&
      (needs.fetch-ch1.result == 'success' || needs.fetch-ch1.result == 'skipped') &&
      (needs.fetch-ch1-profiles.result == 'success' || needs.fetch-ch1-profiles.result == 'skipped') &&
      (needs.fetch-ch2.result == 'success' || needs.fetch-ch2.result == 'skipped') &&
      (needs.fetch-ch2-profiles.result == 'success' || needs.fetch-ch2-profiles.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Restore current sandbox data branch
        run: |
          git fetch --depth=1 origin "$DATA_BRANCH" 2>/dev/null || echo "$DATA_BRANCH branch not found yet - starting fresh"
          git checkout FETCH_HEAD -- web_exports/ 2>/dev/null || true
          git reset HEAD -- web_exports/ 2>/dev/null || true

      - name: Download CH1 outputs
        uses: actions/download-artifact@v4
        with:
          name: ch1-output
          path: .

      - name: Download CH1 profile chunks
        uses: actions/download-artifact@v4
        with:
          pattern: ch1-profile-*
          merge-multiple: true
          path: web_profile_chunks

      - name: Download CH2 outputs
        uses: actions/download-artifact@v4
        with:
          pattern: ch2-map-*
          merge-multiple: false
          path: map_chunks/ch2

      - name: Download CH2 profile chunks
        uses: actions/download-artifact@v4
        with:
          pattern: ch2-profile-*
          merge-multiple: true
          path: web_profile_chunks

      - name: Merge CH2 map chunks
        run: uv run python scripts/merge_map_chunks.py

      - name: Apply data retention
        run: python scripts/apply_retention.py

      - name: Generate combined manifest
        run: uv run python generate_combined_manifest.py

      - name: Generate web exports
        env:
          WIND_WEB_LEVELS: 10m_AGL,800m_AGL,1500m_AMSL,2000m_AMSL,3000m_AMSL,4000m_AMSL
          WEB_EXPORT_DIR: web_exports_staging
          WEB_EXPORT_URL_PREFIX: web_exports
        run: uv run python generate_web_exports.py

      - name: Merge staged web exports and apply web retention
        env:
          WEB_EXPORT_STAGING_DIR: web_exports_staging
          WEB_EXPORT_DIR: web_exports
          WEB_EXPORT_DATA_ROOT: ${{ env.WEB_EXPORT_DATA_ROOT }}
        run: python scripts/apply_web_retention.py

      - name: Validate publish outputs
        env:
          EXPECTED_WEB_EXPORT_DATA_ROOT: ${{ env.WEB_EXPORT_DATA_ROOT }}
        run: python scripts/validate_outputs.py

      - name: Measure output
        run: |
          echo "CH1 .nc files: $(find cache_data -name '*.nc' 2>/dev/null | wc -l)"
          echo "CH2 .nc files: $(find cache_data_ch2 -name '*.nc' 2>/dev/null | wc -l)"
          echo "Packed wind-map .nc files: $(find cache_wind_packed -name '*.nc' 2>/dev/null | wc -l)"
          echo "Sunshine map step binaries: $(find cache_sunshine_maps -name '*.bin' 2>/dev/null | wc -l)"
          echo "web_exports files: $(find web_exports -type f 2>/dev/null | wc -l)"
          echo "web_exports .nc files: $(find web_exports -name '*.nc' 2>/dev/null | wc -l)"
          du -sh cache_data cache_data_ch2 cache_data_packed cache_data_ch2_packed cache_wind_packed cache_sunshine_maps web_exports 2>/dev/null || true

      - name: Commit and push sandbox data
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          git config --global http.postBuffer 524288000

          mkdir -p web_exports

          git checkout --orphan data-temp
          git rm -rf --cached . 2>/dev/null || true
          git add -f web_exports/
          if ! git diff --cached --quiet; then
            git commit -m "Web export snapshot: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push origin HEAD:"$DATA_BRANCH" --force
          else
            echo "No data to push to $DATA_BRANCH"
          fi
          git checkout -f main
          git branch -D data-temp

  noop:
    needs: preflight
    if: needs.preflight.outputs.should_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip unchanged data
        run: |
          echo "Skipping data update: ${{ needs.preflight.outputs.reason }}"
