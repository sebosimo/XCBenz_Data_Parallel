name: Backend quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: backend-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Run unit and contract tests
        env:
          TEST_TMPDIR: ${{ runner.temp }}
        run: uv run python -m unittest discover -s tests -v

      - name: Validate Python sources
        run: uv run python -m compileall -q -x '(^|/)(\.git|\.venv)/' .
